services:
  db:
    image: postgres:16
    container_name: handoveros-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handoveros}
      POSTGRES_USER: ${POSTGRES_USER:-handoveros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env or environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handoveros} -d ${POSTGRES_DB:-handoveros}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handoveros-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-handoveros}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env or environment}@db:5432/${POSTGRES_DB:-handoveros}
      SOURCE_STORAGE_BACKEND: ${SOURCE_STORAGE_BACKEND:-local}
      SOURCE_STORAGE_ROOT: /app/source_files
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - source_files:/app/source_files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: handoveros-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  source_files: