services:
  db:
    image: postgres:16
    container_name: handoveros-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handoveros}
      POSTGRES_USER: ${POSTGRES_USER:-handoveros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handoveros} -d ${POSTGRES_DB:-handoveros}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handoveros-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-handoveros}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-handoveros}
      SOURCE_STORAGE_BACKEND: ${SOURCE_STORAGE_BACKEND:-local}
      SOURCE_STORAGE_ROOT: /app/source_files
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - source_files:/app/source_files

volumes:
  postgres_data:
  source_files:
